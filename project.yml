# Xcode project definition for XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Run `xcodegen generate` to rebuild mlx-fuse-model-test.xcodeproj from this file.
name: mlx-fuse-model-test
options:
  bundleIdPrefix: com.charithgunasekara.mlx-fuse-model
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

packages:
  # MLXLLM and MLXLMCommon moved here out of mlx-swift-examples. Most guides
  # online still name the old repository.
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: "3.31.4"
  # Only for the tokenizer. Nothing is downloaded; it reads tokenizer.json
  # from the model folder you pick.
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: "1.3.3"

targets:
  mlx-fuse-model-test:
    type: application
    platform: macOS
    sources:
      - path: mlx-fuse-model-test
    dependencies:
      - package: mlx-swift-lm
        products: [MLXLLM, MLXLMCommon, MLXHuggingFace]
      - package: swift-transformers
        products: [Tokenizers]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charithgunasekara.mlx-fuse-model.mlx-fuse-model-test
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Off on purpose. With the sandbox on, the model folder saved in
        # UserDefaults stops being readable after a restart unless you add
        # security-scoped bookmarks. This is a local developer tool.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
